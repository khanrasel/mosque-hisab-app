name: Build Mosque Hisab APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'mosque_hisab_android_project.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Check ZIP file
        run: |
          ls -lh
          test -f mosque_hisab_android_project.zip

      - name: Extract project
        run: |
          unzip -q mosque_hisab_android_project.zip -d extracted
          find extracted -maxdepth 3 -name gradlew -print

      - name: Locate Android project
        run: |
          GRADLEW=$(find extracted -maxdepth 3 -type f -name gradlew | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found in ZIP file"
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$GRADLEW")" >> "$GITHUB_ENV"

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mosque-hisab-apk
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
